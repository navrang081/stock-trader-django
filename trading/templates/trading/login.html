<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stock Trader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            padding: 40px;
            width: 380px;
        }
        .brand-icon {
            font-size: 40px;
            color: #4cd137;
        }
        .btn-primary-custom {
            background: #4cd137;
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: #3fb52e;
        }
        .form-control:focus {
            border-color: #4cd137;
            box-shadow: 0 0 0 0.2rem rgba(76, 209, 55, 0.25);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-chart-line brand-icon"></i>
            <h3 class="mt-2 fw-bold" style="color:#1a1a2e;">Stock Trader</h3>
            <p class="text-muted">Login to your account</p>
        </div>

        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 text-white rounded-3">Login</button>
        </form>

        <p class="text-center mt-3 mb-0 text-muted">
            New here? <a href="{% url 'signup' %}" style="color:#1a1a2e; font-weight:600;">Create an account</a>
        </p>
    </div>

</body>
</html>
